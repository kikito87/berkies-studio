name: Drive to drafts (manual)

# Manual only. For each image in the shared Drive folder without a draft (max 5 per run):
# download, measure with real image tools, compute print sizes with the APP'S OWN
# rules (read from index.html at this commit), then draft the listing with the APP'S
# OWN prompt and save everything to Supabase `drafts`.
# Public logs show counts and pixel sizes only: no file names, IDs, EXIF/GPS or draft text.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvips-tools libimage-exiftool-perl > /dev/null
          pip install --quiet google-auth requests

      - name: Get app rules from index.html
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/index.html" -o index.html
          cat > extract.js << 'JS'
          // Pull the app's own prompt + print-size math out of index.html at run time,
          // so the scheduled job and the app always share one source of truth.
          const fs = require('fs'), vm = require('vm');
          const html = fs.readFileSync(process.argv[2], 'utf8');
          function balanced(start, open, close) {
            let d = 0, j = html.indexOf(open, start);
            for (let k = j; k < html.length; k++) {
              if (html[k] === open) d++;
              else if (html[k] === close && --d === 0) return k + 1;
            }
            throw new Error('unbalanced at ' + start);
          }
          function grab(marker, open, close) {
            const i = html.indexOf(marker); if (i < 0) throw new Error('missing: ' + marker);
            return html.slice(i, balanced(i, open, close));
          }
          function grabTpl(name) {
            const i = html.indexOf(`const ${name} = \``); if (i < 0) throw new Error('missing: ' + name);
            for (let k = html.indexOf('`', i) + 1; k < html.length; k++) {
              if (html[k] === '\\') { k++; continue; }
              if (html[k] === '`') return html.slice(i, k + 1);
            }
            throw new Error('unterminated: ' + name);
          }
          const src = [
            grab('const CONFIG = {', '{', '}') + ';',
            'const CURRENT_YEAR = new Date().getFullYear();',
            grabTpl('BRAND_IDENTITY') + ';',
            grabTpl('LISTING_SYSTEM') + ';',
            grab('const FRAME_SIZES = [', '[', ']') + ';',
            grab('function computePrintOptions(', '{', '}'),
            grab('function compressionFlag(', '{', '}'),
            grab('function buildPrintNote(', '{', '}'),
            `const input = JSON.parse(process_input);
             out = { system: LISTING_SYSTEM, appVersion: CONFIG.version, modelFallback: CONFIG.modelFallback,
                     minPPI: CONFIG.minPPI, premiumPPI: CONFIG.premiumPPI, items: input.map(f => {
               const p = computePrintOptions(f.w, f.h);
               const fmt = f.fileType || null;
               return { id: f.id, print: p, compressionFlag: compressionFlag(f.w, f.h, f.bytes),
                        printNote: p && !p.tooLow ? buildPrintNote(p.defaultMax.label, p.example.label, fmt) : null };
             }) };`
          ].join('\n');
          const ctx = { out: null, process_input: fs.readFileSync(0, 'utf8') };
          vm.createContext(ctx); vm.runInContext(src, ctx);
          process.stdout.write(JSON.stringify(ctx.out));
          JS
          echo '[{"id":"selftest","w":12604,"h":16808,"bytes":215328155,"fileType":"JPEG"}]' | node extract.js index.html > /dev/null
          echo "App prompt and print rules loaded OK"

      - name: Drive to Supabase (with drafts)
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: https://afnfnvbpbbmrgcsbpswc.supabase.co
          MAX_PER_RUN: "5"
          PYTHONUNBUFFERED: "1"
        run: |
          cat > job.py << 'PY'
          import base64, datetime, json, os, re, subprocess, sys, time, requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          def log(*a): print(*a, flush=True)

          for k in ("GDRIVE_SA_KEY", "DRIVE_FOLDER_ID", "SUPABASE_SECRET_KEY", "ANTHROPIC_API_KEY"):
              if not os.environ.get(k, "").strip():
                  sys.exit(f"Missing secret: {k}")
          MAX = int(os.environ.get("MAX_PER_RUN", "5"))

          raw = os.environ["DRIVE_FOLDER_ID"].strip()
          m = re.search(r"/folders/([A-Za-z0-9_-]+)", raw)
          folder = m.group(1) if m else raw
          log(f"::add-mask::{folder}")

          # ---------- Drive ----------
          creds = service_account.Credentials.from_service_account_info(
              json.loads(os.environ["GDRIVE_SA_KEY"]),
              scopes=["https://www.googleapis.com/auth/drive.readonly"])
          creds.refresh(Request())
          gh = {"Authorization": f"Bearer {creds.token}"}

          # ---------- Supabase (sb_ keys go in apikey header only) ----------
          sk = os.environ["SUPABASE_SECRET_KEY"].strip()
          sb = {"apikey": sk, "Content-Type": "application/json"}
          if not sk.startswith("sb_"):
              sb["Authorization"] = f"Bearer {sk}"
          rest = os.environ["SUPABASE_URL"].rstrip("/") + "/rest/v1/drafts"

          def sb_upsert(row):
              w = requests.post(rest, headers={**sb, "Prefer": "resolution=merge-duplicates,return=minimal"},
                                params={"on_conflict": "drive_file_id"}, data=json.dumps(row), timeout=30)
              if w.status_code not in (200, 201, 204):
                  sys.exit(f"Supabase write failed: HTTP {w.status_code} {w.text[:200]}")

          r = requests.get(rest, headers=sb, params={"select": "drive_file_id,print_facts,draft"}, timeout=30)
          if r.status_code != 200:
              sys.exit(f"Supabase read failed: HTTP {r.status_code} {r.text[:200]}")
          rows = {x["drive_file_id"]: x for x in r.json()}

          r = requests.get("https://www.googleapis.com/drive/v3/files", headers=gh, params={
              "q": f"'{folder}' in parents and trashed=false and mimeType contains 'image/'",
              "orderBy": "createdTime", "pageSize": 100, "fields": "files(id,name,mimeType,size)",
              "supportsAllDrives": "true", "includeItemsFromAllDrives": "true"}, timeout=60)
          if r.status_code != 200:
              sys.exit(f"Drive list failed: HTTP {r.status_code}")
          files = r.json().get("files", [])
          for f in files:
              log(f"::add-mask::{f['id']}")
          todo = [f for f in files if not (rows.get(f["id"]) or {}).get("draft")][:MAX]
          log(f"Images in folder: {len(files)}   already drafted: {len(files) - len([f for f in files if not (rows.get(f['id']) or {}).get('draft')])}   to process now: {len(todo)}")
          if not todo:
              log("Nothing to do."); sys.exit(0)

          # ---------- Model (same rule as the app: newest Sonnet, else app fallback) ----------
          ak = os.environ["ANTHROPIC_API_KEY"].strip()
          ah = {"x-api-key": ak, "anthropic-version": "2023-06-01", "content-type": "application/json"}
          app = None  # filled per run from index.html via extract.js
          def app_logic(items):
              p = subprocess.run(["node", "extract.js", "index.html"], input=json.dumps(items),
                                 capture_output=True, text=True)
              if p.returncode != 0:
                  sys.exit("Could not read prompt/print math from index.html: " + p.stderr[-300:])
              return json.loads(p.stdout)

          model = None
          try:
              mr = requests.get("https://api.anthropic.com/v1/models", headers=ah, timeout=30)
              ids = sorted([x["id"] for x in mr.json().get("data", []) if "claude-sonnet" in x.get("id", "")], reverse=True)
              model = ids[0] if ids else None
          except Exception:
              pass

          def sh(*args):
              return subprocess.run(args, capture_output=True, text=True, check=True).stdout.strip()

          def measure(path, f):
              facts = {"width_px": int(sh("vipsheader", "-f", "width", path)),
                       "height_px": int(sh("vipsheader", "-f", "height", path)),
                       "channels": int(sh("vipsheader", "-f", "bands", path)),
                       "file_bytes": os.path.getsize(path), "mime_type": f["mimeType"]}
              ex = json.loads(sh("exiftool", "-j", "-FileType", "-BitsPerSample", "-ColorSpace",
                                 "-ProfileDescription", "-XResolution", "-YResolution", "-ResolutionUnit", path))[0]
              facts.update({"file_type": ex.get("FileType"), "bits_per_sample": ex.get("BitsPerSample"),
                            "color_space": ex.get("ColorSpace"), "icc_profile": ex.get("ProfileDescription"),
                            "dpi_tag_x": ex.get("XResolution"), "dpi_tag_y": ex.get("YResolution"),
                            "dpi_tag_unit": ex.get("ResolutionUnit")})
              sh("vips", "avg", path)
              facts["full_decode_ok"] = True
              try:
                  facts["measured_by"] = sh("vips", "--version").split()[0] + " + exiftool " + sh("exiftool", "-ver")
              except Exception:
                  facts["measured_by"] = "libvips + exiftool"
              facts["measured_at"] = datetime.datetime.now(datetime.timezone.utc).isoformat()
              return facts

          def descriptive_metadata(path):
              # Sent to the AI only. Never logged, never stored. No GPS coordinates.
              ex = json.loads(sh("exiftool", "-j", "-Title", "-ObjectName", "-Description", "-Caption-Abstract",
                                 "-Headline", "-Subject", "-Keywords", "-City", "-State", "-Province-State",
                                 "-Country", "-Country-PrimaryLocationName", "-Location", "-Sub-location", path))[0]
              out = {}
              for k, v in ex.items():
                  if k == "SourceFile" or v in (None, "", []):
                      continue
                  out[k] = v if isinstance(v, (str, int, float)) else ", ".join(map(str, v)) if isinstance(v, list) else str(v)
              return out

          def guess_location(meta, name):
              parts = [meta.get(k) for k in ("Sub-location", "Location", "City", "State", "Province-State", "Country", "Country-PrimaryLocationName")]
              parts = [str(p) for p in parts if p]
              return ", ".join(dict.fromkeys(parts)) if parts else "unspecified (infer from the file name and image if clear, otherwise stay general)"

          def call_claude(system, content):
              messages = [{"role": "user", "content": content}]
              tools = [{"type": "web_search_20250305", "name": "web_search"}]
              text = ""
              for _ in range(4):  # server-side web search can pause long turns; continue them
                  body = {"model": model or app["modelFallback"], "max_tokens": 8000,
                          "system": system, "tools": tools, "messages": messages}
                  for attempt in range(3):
                      resp = requests.post("https://api.anthropic.com/v1/messages", headers=ah,
                                           data=json.dumps(body), timeout=300)
                      if resp.status_code in (429, 500, 502, 503, 529):
                          time.sleep(15 * (attempt + 1)); continue
                      break
                  if resp.status_code != 200:
                      raise RuntimeError(f"Anthropic HTTP {resp.status_code}: {resp.text[:200]}")
                  data = resp.json()
                  text += "".join(b.get("text", "") for b in data.get("content", []) if b.get("type") == "text")
                  if data.get("stop_reason") == "pause_turn":
                      messages = messages + [{"role": "assistant", "content": data["content"]}]
                      continue
                  return text, data.get("model"), data.get("usage", {})
              raise RuntimeError("Anthropic kept pausing; gave up")

          def parse_listing(text):
              t = re.sub(r"```(?:json)?", "", text).strip()
              i, j = t.find("["), t.rfind("]")
              if i < 0 or j < 0:
                  raise ValueError("no JSON array in reply")
              arr = json.loads(t[i:j + 1])
              if not arr or not isinstance(arr[0], dict):
                  raise ValueError("empty JSON array")
              return arr[0]

          SPEC_RE = re.compile(r"\b\d{1,3}\s*(?:x|×|by)\s*\d{1,3}\b|\b\d{2,4}\s*(?:dpi|ppi)\b|\bmegapixel|\b\d+\s*(?:mp|MP)\b", re.I)
          def checks(l):
              warn = []
              t = l.get("title") or ""
              if len(t) > 140: warn.append(f"title is {len(t)} chars (max 140)")
              tags = l.get("tags") or []
              if l.get("post_type", "product") == "product" and len(tags) != 13: warn.append(f"{len(tags)} tags (expected 13)")
              long_tags = [x for x in tags if len(x) >= 20]
              if long_tags: warn.append(f"{len(long_tags)} tag(s) are 20+ chars")
              if SPEC_RE.search(l.get("description") or ""): warn.append("description mentions a size/DPI; print specs must come from the file only")
              return warn

          ok = fail = 0
          for n, f in enumerate(todo, 1):
              log(f"[{n}/{len(todo)}] downloading…")
              row = {"drive_file_id": f["id"], "file_name": f["name"]}
              try:
                  with requests.get(f"https://www.googleapis.com/drive/v3/files/{f['id']}", headers=gh,
                                    params={"alt": "media", "supportsAllDrives": "true"}, stream=True, timeout=900) as d:
                      d.raise_for_status()
                      with open("/tmp/img", "wb") as out:
                          for chunk in d.iter_content(8 << 20):
                              out.write(chunk)
                  if str(os.path.getsize("/tmp/img")) != str(f.get("size")):
                      raise RuntimeError("download size does not match Drive")

                  pf = (rows.get(f["id"]) or {}).get("print_facts") or measure("/tmp/img", f)
                  log(f"[{n}] measured: {pf['width_px']} x {pf['height_px']} px")

                  app = app_logic([{"id": f["id"], "w": pf["width_px"], "h": pf["height_px"],
                                    "bytes": pf["file_bytes"], "fileType": pf.get("file_type")}])
                  item = app["items"][0]
                  pf["print_options"] = item["print"]
                  pf["print_note"] = item["printNote"]
                  pf["compression_flag"] = item["compressionFlag"]
                  pf["print_rules"] = {"minPPI": app["minPPI"], "premiumPPI": app["premiumPPI"], "app_version": app["appVersion"]}
                  row["print_facts"] = pf

                  meta = descriptive_metadata("/tmp/img")
                  subprocess.run(["vipsthumbnail", "/tmp/img", "-s", "1568x1568", "-o", "/tmp/prev.jpg[Q=85,strip]"], check=True)
                  b64 = base64.b64encode(open("/tmp/prev.jpg", "rb").read()).decode()

                  stem = os.path.splitext(f["name"])[0].replace("_", " ")
                  desc = "; ".join(f"{k}: {v}" for k, v in meta.items())
                  desc = (f"File name: {stem}. " + (f"Photographer's Lightroom metadata: {desc}." if desc else "No title/caption/keywords in metadata."))
                  content = [
                      {"type": "text", "text": "Generate one result for each of the 1 photo(s) below. Return a JSON array with exactly 1 object(s). Each photo has a post_type that controls what to produce."},
                      {"type": "image", "source": {"type": "base64", "media_type": "image/jpeg", "data": b64}},
                      {"type": "text", "text": f"Photo 1: post_type=product, product_format=digital print, location={guess_location(meta, stem)}. Description: {desc}"},
                  ]
                  log(f"[{n}] drafting listing (with live trend research)…")
                  text, used_model, usage = call_claude(app["system"], content)
                  listing = parse_listing(text)
                  row["draft"] = {"listing": listing, "warnings": checks(listing), "model": used_model,
                                  "app_version": app["appVersion"], "usage": usage,
                                  "generated_at": datetime.datetime.now(datetime.timezone.utc).isoformat()}
                  row["error"] = None
                  log(f"[{n}] drafted. warnings: {len(row['draft']['warnings'])}")
                  ok += 1
              except Exception as e:
                  row["error"] = f"{type(e).__name__}: {str(e)[:300]}"
                  log(f"[{n}] failed: {type(e).__name__}")
                  fail += 1
              finally:
                  for p in ("/tmp/img", "/tmp/prev.jpg"):
                      if os.path.exists(p): os.remove(p)
              sb_upsert(row)

          log(f"Done. drafted={ok} failed={fail}")
          if fail:
              sys.exit(1)
          PY
          python3 job.py
